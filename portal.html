<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#153350">
<title>Mariantonia — Portal de sucursal</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  color-scheme: light;
  --navy-900:#0C1F33; --navy:#153350; --navy-600:#27567A; --navy-300:#8FA6B8;
  --cream:#F2EDE1; --paper:#FCFAF4; --sand:#E8DABE; --terra:#A8412F;
  --terra-soft:#F2DFD8; --line:#DED5C2; --ink:#153350; --ink-2:#5C7186;
  --verde:#2F8F5B; --verde-soft:#DCEBE2; --frio:#1B5E8C;
  --d:'Jost','Futura',sans-serif; --b:'DM Sans','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation;font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
body{margin:0;background:var(--cream);font-family:var(--b);color:var(--ink);
     padding-bottom:env(safe-area-inset-bottom)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--terra);outline-offset:2px;border-radius:6px}

.bar{background:var(--navy);color:var(--paper);padding:14px 18px;display:flex;
     align-items:center;gap:14px;position:sticky;top:0;z-index:10}
.bar .wm{font-family:var(--d);font-size:15px;letter-spacing:.2em;text-indent:.2em;font-weight:400}
.bar select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
            color:var(--paper);border-radius:9px;padding:8px 11px;font-size:13px;margin-left:auto}
.bar select option{color:#000}
.bar select:disabled{opacity:1;appearance:none;background:rgba(255,255,255,.07);border-style:dashed;padding-right:11px}
.bar .out{font-size:11.5px;opacity:.6;letter-spacing:.06em;text-transform:uppercase}

.wrap{max-width:860px;margin:0 auto;padding:18px}

.tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);
      border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:11px;border-radius:9px;font-size:13.5px;color:var(--ink-2)}
.tabs button.on{background:var(--navy);color:var(--paper);font-weight:700}

.fechas{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.fechas::-webkit-scrollbar{display:none}
.fechas button{flex:0 0 auto;background:var(--paper);border:1px solid var(--line);
               border-radius:11px;padding:10px 14px;text-align:left;min-width:112px}
.fechas button.on{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.fechas .dd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.fechas .nn{font-size:15px;font-weight:700;margin-top:3px}
.fechas .cc{font-size:11.5px;opacity:.7;margin-top:2px}

.kpis{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.kpi{flex:1 1 110px;background:var(--paper);border:1px solid var(--line);
     border-radius:12px;padding:12px 14px}
.kpi .k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.alerta{background:var(--terra-soft);border-color:#E3C4BA}
.kpi.alerta .v{color:var(--terra)}

.ped{background:var(--paper);border:1px solid var(--line);border-radius:14px;
     margin-bottom:11px;overflow:hidden}
.ped.lista{opacity:.6}
.ped.lista .cab{background:var(--verde-soft)}
.cab{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;width:100%;text-align:left}
.cab .quien{flex:1;min-width:0}
.cab .nom{font-size:15.5px;font-weight:700;line-height:1.25}
.cab .sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.cab .der{text-align:right;flex-shrink:0}
.cab .tot{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:5px;justify-content:flex-end;margin-top:5px;flex-wrap:wrap}
.chip{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
      border-radius:20px;padding:4px 8px;white-space:nowrap}
.chip.gris{background:#E8E3D6;color:#6B6A63}
.chip.verde{background:var(--verde-soft);color:#1E4E36}
.chip.rojo{background:var(--terra-soft);color:#6B2418}
.chip.frio{background:#DAEAF4;color:var(--frio)}

.detalle{border-top:1px solid var(--line);padding:4px 16px 16px}
.it{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid #EDE7DA}
.it:last-of-type{border-bottom:none}
.it .q{font-size:17px;font-weight:700;width:34px;flex-shrink:0;font-variant-numeric:tabular-nums}
.it .n{flex:1;font-size:14px;line-height:1.3}
.it .n small{display:block;color:var(--ink-2);font-size:11.5px;margin-top:1px}
.it .p{font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.subt{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--navy-600);
      margin:12px 0 2px;padding-top:9px;border-top:1px solid var(--line)}
.subt.frz{color:var(--frio)}
.nota{background:var(--sand);border-radius:10px;padding:10px 13px;font-size:13px;
      line-height:1.45;margin-top:12px;color:#3A2E1B}
.acciones{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acciones button{flex:1 1 130px;border:1px solid var(--line);border-radius:10px;
                 padding:11px 10px;font-size:12.5px;font-weight:700;letter-spacing:.04em;
                 background:var(--paper)}
.acciones button.on{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.acciones button.cobro.on{background:var(--verde);border-color:var(--verde);color:#fff}

.prodrow{display:flex;gap:14px;align-items:baseline;background:var(--paper);
         border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:8px}
.prodrow .q{font-size:24px;font-weight:700;width:52px;flex-shrink:0;font-variant-numeric:tabular-nums}
.prodrow .n{flex:1;font-size:15px;line-height:1.3}
.prodrow .n small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.grupo{font-family:var(--d);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
       color:var(--navy-600);margin:20px 0 9px;font-weight:500}
.grupo:first-child{margin-top:0}

/* edición */
.erow{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);
      border-radius:12px;padding:12px 14px;margin-bottom:8px}
.erow.off{opacity:.5}
.erow .nn{flex:1;min-width:0;text-align:left}
.erow .nn b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.erow .nn small{display:block;color:var(--ink-2);font-size:11.5px;margin-top:2px}
.erow .pp{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.erow .lapiz{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
             color:var(--ink-2);flex-shrink:0}
.erow .lapiz:active{background:#EFE9DC}
.sw{width:44px;height:25px;border-radius:13px;background:#CBC5B6;position:relative;flex-shrink:0;
    transition:background .15s;border:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
           background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--verde)}
.sw[aria-checked="true"]::after{transform:translateX(19px)}
.form{background:var(--paper);border:1px solid var(--navy-300);border-radius:12px;
      padding:16px;margin-bottom:10px;box-shadow:0 3px 14px rgba(21,51,80,.1)}
.ff{margin-bottom:12px}
.ff label{display:block;font-size:11.5px;letter-spacing:.05em;color:var(--ink-2);margin-bottom:5px}
.ff input,.ff select,.ff textarea{width:100%;background:var(--cream);border:1px solid var(--line);
     border-radius:9px;padding:10px 12px;font-size:14.5px;outline:none;text-align:left;letter-spacing:0}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--navy-600);
     box-shadow:0 0 0 3px rgba(39,86,122,.13)}
.ff .pista{font-size:11.5px;color:var(--navy-300);margin-top:4px;line-height:1.4}
.fgrid{display:flex;gap:10px}
.fgrid .ff{flex:1}
.fcheck{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px}
.fbtns{display:flex;gap:8px;margin-top:4px}
.fbtns button{flex:1;border-radius:10px;padding:12px;font-size:12.5px;font-weight:700;letter-spacing:.05em}
.fbtns .guardar{background:var(--navy);color:var(--paper)}
.fbtns .cancelar{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.fbtns .borrar{flex:0 0 46px;background:var(--terra-soft);color:var(--terra)}
.addbtn{width:100%;border:1px dashed var(--navy-300);border-radius:11px;padding:12px;
        font-size:13px;color:var(--navy-600);margin-bottom:14px;background:transparent}
.grupo .mini{float:right;font-family:var(--b);font-size:11.5px;letter-spacing:0;
             text-transform:none;color:var(--terra);font-weight:500}

.login{max-width:380px;margin:12vh auto;padding:0 20px;text-align:center}
.login .wm{font-family:var(--d);font-size:30px;letter-spacing:.18em;text-indent:.18em;font-weight:400}
.login p{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:18px 0}
input[type=password]{width:100%;background:var(--paper);border:1px solid var(--line);
     border-radius:11px;padding:13px 14px;font-size:15px;outline:none;text-align:center;letter-spacing:.15em}
input[type=password]:focus{border-color:var(--navy-600);box-shadow:0 0 0 3px rgba(39,86,122,.13)}
.btn{display:block;width:100%;background:var(--navy);color:var(--paper);border-radius:12px;
     padding:14px;font-size:13.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-top:12px}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);
           text-transform:none;letter-spacing:0;font-weight:500}
.vacio{text-align:center;padding:60px 20px;color:var(--ink-2);font-size:14px}
.err{background:var(--terra-soft);color:#6B2418;border-radius:10px;padding:11px 14px;
     font-size:13px;margin-top:12px}
@media(prefers-reduced-motion:no-preference){.ped{transition:opacity .2s}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="wm">MARIANTONIA</div>
  <p>Portal de sucursal</p>
  <div class="ff" style="text-align:left"><label>Sucursal</label>
    <select id="loginSuc"></select></div>
  <div class="ff" style="text-align:left"><label>PIN</label>
    <input id="clave" type="password" inputmode="numeric" placeholder="PIN"
           onkeydown="if(event.key==='Enter')entrar()"></div>
  <button class="btn" onclick="entrar()">Entrar</button>
  <div id="loginErr" class="err" hidden></div>
  <p style="font-size:11.5px;color:var(--navy-300);margin-top:22px">
    Cada sucursal tiene su PIN y ve solamente sus pedidos y su catálogo.</p>
</div>

<div id="app" hidden>
  <div class="bar">
    <span class="wm">MARIANTONIA</span>
    <select id="selSuc" onchange="cambiarSuc()"></select>
    <button class="out" onclick="salir()">Salir</button>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button id="tPed" class="on" onclick="verTab('pedidos')">Pedidos</button>
      <button id="tProd" onclick="verTab('produccion')">Producción</button>
      <button id="tCat" onclick="verTab('catalogo')">Catálogo</button>
      <button id="tBar" onclick="verTab('barrios')">Barrios</button>
    </div>
    <div class="fechas" id="fechas"></div>
    <div id="cuerpo"></div>
    <button class="btn ghost" id="btnRefrescar" style="margin-top:20px" onclick="cargar(true)">Actualizar</button>
    <button class="btn ghost" id="btnCSV" onclick="bajarCSV()">Bajar a Excel</button>
    <p style="text-align:center;font-size:11.5px;color:var(--navy-300);margin:22px 0 10px">
      Portal v1.2</p>
  </div>
</div>

<script>
const BACKEND = 'https://script.google.com/macros/s/AKfycbxWxDpgoX4QgXNjrV4S0vK30wOTQbWr4uJoHUlP-WwdMqqmNvZZCvlPFD0Rel0FnJl36Q/exec';

const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
const esc = s => String(s === null || s === undefined ? '' : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jsq = s => esc(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");

let TOKEN = '', SUCS = [], suc = '', tab = 'pedidos';
let PEDIDOS = [], ITEMS = [], fechaSel = null, abierto = {};
let CAT = null, BARRIOS = null, editando = null;   // editando: id de producto, 'nuevo', o slug

const tok = () => { try { return localStorage.getItem('ma_portal') || ''; } catch(e){ return ''; } };

/* ============ ACCESO ============ */
let esAdmin = false;

// El desplegable se llena antes de pedir el PIN: son solo nombres de locales.
async function listarSucursales(){
  try {
    const r = await fetch(BACKEND + '?action=sucursales', { redirect:'follow' });
    const d = await r.json();
    if (d.error || !d.length) throw new Error('sin sucursales');
    SUCS = d;
    let ult = '';
    try { ult = localStorage.getItem('ma_portal_suc') || ''; } catch(e){}
    $('#loginSuc').innerHTML = SUCS.map(x =>
      '<option value="' + esc(x.nombre) + '"' + (x.nombre === ult ? ' selected' : '') + '>' +
      esc(x.nombre) + '</option>').join('');
  } catch(e){
    error('No pudimos conectarnos. Revisá internet.');
  }
}

async function entrar(){
  const v = $('#clave').value.trim();
  if (!v) return error('Escribí el PIN.');
  const elegida = $('#loginSuc').value;
  try {
    const r = await fetch(BACKEND + '?action=entrar&token=' + encodeURIComponent(v),
                          { redirect:'follow' });
    const d = await r.json();
    if (d.error) return error('PIN incorrecto.');

    // Un PIN de sucursal solo abre la suya, diga lo que diga el desplegable.
    if (!d.admin){
      const suya = SUCS.filter(x => x.id === d.suc)[0];
      if (!suya) return error('Ese PIN no corresponde a ninguna sucursal activa.');
      if (suya.nombre !== elegida) return error('Ese PIN no es el de ' + elegida + '.');
    }
    TOKEN = v; esAdmin = !!d.admin;
    suc = d.admin ? elegida : (SUCS.filter(x => x.id === d.suc)[0] || {}).nombre;
    try {
      localStorage.setItem('ma_portal', TOKEN);
      localStorage.setItem('ma_portal_suc', suc);
    } catch(e){}
    arrancarApp();
  } catch(e){ error('No pudimos conectarnos. Revisá internet.'); }
}

function error(m){
  const el = $('#loginErr'); el.textContent = m; el.hidden = false;
  TOKEN = '';
}

function salir(){
  try { localStorage.removeItem('ma_portal'); } catch(e){}
  location.reload();
}

function arrancarApp(){
  $('#login').hidden = true;
  $('#app').hidden = false;
  const sel = $('#selSuc');
  sel.innerHTML = (esAdmin ? SUCS : SUCS.filter(x => x.nombre === suc))
    .map(x => '<option value="' + esc(x.nombre) + '">' + esc(x.nombre) + '</option>').join('');
  sel.value = suc;
  sel.disabled = !esAdmin;        // el encargado no se puede cambiar de sucursal
  cargar();
}

function cambiarSuc(){
  suc = $('#selSuc').value;
  try { localStorage.setItem('ma_portal_suc', suc); } catch(e){}
  fechaSel = null; CAT = null; BARRIOS = null; editando = null;
  if (tab === 'catalogo') return cargarCatalogo();
  if (tab === 'barrios')  return cargarBarrios();
  cargar();
}

/* ============ DATOS ============ */
async function cargar(silencio){
  if (!silencio) $('#cuerpo').innerHTML = '<div class="vacio">Cargando…</div>';
  try {
    const r = await fetch(BACKEND + '?action=pedidos&token=' + encodeURIComponent(TOKEN) +
                          '&suc=' + encodeURIComponent(suc), { redirect:'follow' });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    PEDIDOS = d.pedidos || [];
    ITEMS = d.items || [];
    pintar();
  } catch(e){
    $('#cuerpo').innerHTML = '<div class="err">No se pudieron traer los pedidos: ' +
      esc(e.message) + '</div>';
  }
}

// La fecha llega como ISO desde la planilla; para agrupar alcanza el día.
const dia = f => {
  const d = new Date(f);
  return isNaN(d.getTime()) ? String(f)
    : String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
};
const diaLargo = f => {
  const d = new Date(f);
  return isNaN(d.getTime()) ? String(f)
    : d.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
};

const fechas = () => {
  const m = {};
  PEDIDOS.forEach(p => { const k = dia(p.entrega); m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).sort((a,b) => {
    const [da,ma] = a.split('/'), [db,mb] = b.split('/');
    return (ma - mb) || (da - db);
  }).map(k => ({ k, n: m[k] }));
};

const delDia = () => PEDIDOS.filter(p => dia(p.entrega) === fechaSel);
const itemsDe = id => ITEMS.filter(i => String(i.pedido_id).trim() === String(id).trim());
const esFrz = i => String(i.conservacion).trim() === 'freezer';
const cobrado = p => String(p.cobrado).trim().toUpperCase() === 'SI';
const estado = p => String(p.estado || 'pendiente').trim();

/* ============ PINTAR ============ */
function pintar(){
  if (tab === 'catalogo') return pintarCatalogo();
  if (tab === 'barrios')  return pintarBarrios();
  const fs = fechas();
  if (!fechaSel || !fs.some(f => f.k === fechaSel)) fechaSel = fs.length ? fs[0].k : null;

  $('#fechas').innerHTML = fs.map(f => {
    const p0 = PEDIDOS.filter(p => dia(p.entrega) === f.k)[0];
    return '<button class="'+(f.k === fechaSel ? 'on' : '')+'" onclick="verFecha(\''+f.k+'\')">' +
      '<div class="dd">'+esc(diaLargo(p0.entrega).split(' ')[0])+'</div>' +
      '<div class="nn">'+f.k+'</div>' +
      '<div class="cc">'+f.n+(f.n === 1 ? ' pedido' : ' pedidos')+'</div></button>';
  }).join('');

  if (!fechaSel) {
    $('#cuerpo').innerHTML = '<div class="vacio">Todavía no hay pedidos para esta sucursal.</div>';
    return;
  }
  tab === 'pedidos' ? pintarPedidos() : pintarProduccion();
}

const verFecha = f => { fechaSel = f; pintar(); };
function verTab(t){
  tab = t;
  editando = null;
  [['tPed','pedidos'],['tProd','produccion'],['tCat','catalogo'],['tBar','barrios']]
    .forEach(function(x){ $('#'+x[0]).classList.toggle('on', t === x[1]); });
  const dePedidos = (t === 'pedidos' || t === 'produccion');
  $('#fechas').hidden = !dePedidos;
  $('#btnCSV').hidden = !dePedidos;
  $('#btnRefrescar').hidden = !dePedidos;
  if (t === 'catalogo') return cargarCatalogo();
  if (t === 'barrios')  return cargarBarrios();
  pintar();
}

function pintarPedidos(){
  const ps = delDia();
  const faltaCobrar = ps.filter(p => !cobrado(p));
  const entregados = ps.filter(p => estado(p) === 'entregado');

  let h = '<div class="kpis">' +
    '<div class="kpi"><div class="k">Pedidos</div><div class="v">'+ps.length+'</div></div>' +
    '<div class="kpi"><div class="k">Entregados</div><div class="v">'+entregados.length+'</div></div>' +
    '<div class="kpi"><div class="k">A cobrar</div><div class="v">' +
      money(ps.reduce((s,p) => s + (Number(p.total) || 0), 0)) + '</div></div>' +
    (faltaCobrar.length
      ? '<div class="kpi alerta"><div class="k">Falta cobrar</div><div class="v">' +
        money(faltaCobrar.reduce((s,p) => s + (Number(p.total) || 0), 0)) + '</div></div>'
      : '') +
    '</div>';

  h += ps.map(p => {
    const id = String(p.id).trim(), its = itemsDe(id), ab = abierto[id];
    const est = estado(p), cob = cobrado(p);
    const frz = its.some(esFrz);
    return '<div class="ped'+(est === 'entregado' && cob ? ' lista' : '')+'">' +
      '<button class="cab" onclick="abrir(\''+jsq(id)+'\')">' +
        '<div class="quien">' +
          '<div class="nom">'+esc(p.cliente)+'</div>' +
          '<div class="sub">'+esc(p.barrio)+(p.piso_depto ? ' · '+esc(p.piso_depto) : '') +
            ' · '+esc(p.telefono)+'</div>' +
        '</div>' +
        '<div class="der"><div class="tot">'+money(p.total)+'</div>' +
          '<div class="chips">' +
            (frz ? '<span class="chip frio">Freezer</span>' : '') +
            '<span class="chip '+(est === 'entregado' ? 'verde' : 'gris')+'">'+esc(est)+'</span>' +
            (cob ? '<span class="chip verde">Cobrado</span>'
                 : '<span class="chip rojo">'+esc(p.pago || 'sin pago')+'</span>') +
          '</div></div>' +
      '</button>' +
      (ab ? detalle(p, its, est, cob) : '') + '</div>';
  }).join('') || '<div class="vacio">No hay pedidos para esta fecha.</div>';

  $('#cuerpo').innerHTML = h;
}

function detalle(p, its, est, cob){
  const id = jsq(String(p.id).trim());
  const linea = i =>
    '<div class="it"><div class="q">'+i.cantidad+'</div>' +
    '<div class="n">'+esc(i.producto)+(i.unidad ? '<small>'+esc(i.unidad)+'</small>' : '')+'</div>' +
    '<div class="p">'+money(i.subtotal)+'</div></div>';
  const frescos = its.filter(i => !esFrz(i)), frz = its.filter(esFrz);

  return '<div class="detalle">' +
    (frz.length && frescos.length ? '<div class="subt">Fresco</div>' : '') +
    frescos.map(linea).join('') +
    (frz.length ? '<div class="subt frz">Para freezar — bolsas chicas / film</div>' : '') +
    frz.map(linea).join('') +
    (p.comentarios ? '<div class="nota">'+esc(p.comentarios)+'</div>' : '') +
    '<div class="acciones">' +
      '<button class="'+(est === 'preparado' ? 'on' : '')+'" onclick="marcar(\''+id+'\',\'preparado\')">Preparado</button>' +
      '<button class="'+(est === 'entregado' ? 'on' : '')+'" onclick="marcar(\''+id+'\',\'entregado\')">Entregado</button>' +
      '<button class="cobro '+(cob ? 'on' : '')+'" onclick="cobrar(\''+id+'\','+(cob ? 'false' : 'true')+')">' +
        (cob ? 'Cobrado ✓' : 'Marcar cobrado') + '</button>' +
    '</div></div>';
}

function pintarProduccion(){
  const ids = {};
  delDia().forEach(p => { ids[String(p.id).trim()] = true; });
  const its = ITEMS.filter(i => ids[String(i.pedido_id).trim()]);

  const acum = {};
  its.forEach(i => {
    const k = String(i.modulo).trim()+'||'+String(i.producto).trim()+'||' +
              String(i.unidad || '').trim()+'||'+(esFrz(i) ? 'f' : 'n');
    if (!acum[k]) acum[k] = { modulo:String(i.modulo).trim(), producto:String(i.producto).trim(),
                              unidad:String(i.unidad || '').trim(), frz:esFrz(i), qty:0 };
    acum[k].qty += Number(i.cantidad) || 0;
  });

  const lista = Object.keys(acum).map(k => acum[k]);
  if (!lista.length){
    $('#cuerpo').innerHTML = '<div class="vacio">Nada para producir en esta fecha.</div>';
    return;
  }
  lista.sort((a,b) => a.modulo === b.modulo
    ? a.producto.localeCompare(b.producto) : a.modulo.localeCompare(b.modulo));

  let h = '<div class="kpis">' +
    '<div class="kpi"><div class="k">Entrega</div><div class="v" style="font-size:15px;padding-top:4px">' +
      esc(diaLargo(delDia()[0].entrega)) + '</div></div>' +
    '<div class="kpi"><div class="k">Unidades</div><div class="v">' +
      lista.reduce((s,x) => s + x.qty, 0) + '</div></div></div>';

  let mod = '';
  lista.forEach(x => {
    if (x.modulo !== mod){ mod = x.modulo; h += '<div class="grupo">'+esc(mod)+'</div>'; }
    h += '<div class="prodrow"><div class="q">'+x.qty+'</div>' +
      '<div class="n">'+esc(x.producto) +
        (x.unidad ? '<small>'+esc(x.unidad)+'</small>' : '')+'</div>' +
      (x.frz ? '<span class="chip frio">Freezer</span>' : '') + '</div>';
  });
  $('#cuerpo').innerHTML = h;
}

/* ============ CATÁLOGO ============ */
const CONS = [['preparar','Fresco, se prepara para freezar'],
              ['apto','Fresco, ya viene apto para freezar'],
              ['congelado','Ya viene congelado'],
              ['no','No se freeza']];

const sucId = () => (SUCS.filter(x => x.nombre === suc)[0] || {}).id || '';

async function cargarCatalogo(){
  $('#cuerpo').innerHTML = '<div class="vacio">Cargando catálogo…</div>';
  try {
    const r = await fetch(BACKEND + '?action=catalogo&token=' + encodeURIComponent(TOKEN) +
                          '&suc=' + encodeURIComponent(sucId()), { redirect:'follow' });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    CAT = d;
    pintarCatalogo();
  } catch(e){
    $('#cuerpo').innerHTML = '<div class="err">No se pudo traer el catálogo: ' + esc(e.message) + '</div>';
  }
}

function pintarCatalogo(){
  if (!CAT) return cargarCatalogo();
  const act = CAT.filter(p => p.activo).length;

  let h = '<div class="kpis">' +
    '<div class="kpi"><div class="k">Productos</div><div class="v">' + CAT.length + '</div></div>' +
    '<div class="kpi"><div class="k">Visibles</div><div class="v">' + act + '</div></div>' +
    (CAT.length - act
      ? '<div class="kpi alerta"><div class="k">Ocultos</div><div class="v">' + (CAT.length - act) + '</div></div>'
      : '') + '</div>';

  if (editando === 'nuevo') h += formProducto(null);

  const mods = [];
  CAT.forEach(p => { if (!mods.some(m => m.id === p.modulo_id))
    mods.push({ id:p.modulo_id, nombre:p.modulo }); });

  mods.forEach(m => {
    h += '<div class="grupo">' + esc(m.nombre) +
      '<button class="mini" data-nuevo="' + esc(m.id) + '">+ producto</button></div>';
    CAT.filter(p => p.modulo_id === m.id).forEach(p => {
      h += (editando === p.id) ? formProducto(p) : filaProducto(p);
    });
  });

  h += '<button class="addbtn" data-nuevo="">+ Agregar producto en un módulo nuevo</button>';
  $('#cuerpo').innerHTML = h;
}

function filaProducto(p){
  return '<div class="erow' + (p.activo ? '' : ' off') + '">' +
    '<button class="sw" role="switch" aria-checked="' + (p.activo ? 'true' : 'false') +
      '" data-tog="' + esc(p.id) + '" aria-label="Visible"></button>' +
    '<div class="nn"><b>' + esc(p.producto) + (p.destacado ? ' ★' : '') + '</b>' +
      (p.unidad || p.formatos ? '<small>' + esc(p.formatos || p.unidad) + '</small>' : '') + '</div>' +
    '<div class="pp">' + money(p.precio) + '</div>' +
    '<button class="lapiz" data-edit="' + esc(p.id) + '" aria-label="Editar">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>' +
    '</button></div>';
}

function formProducto(p){

  const grupos = [];
  (CAT || []).forEach(x => { if (x.modulo_id === v.modulo_id && grupos.indexOf(x.grupo) === -1)

    '</div>' +

      '<div class="pista">Vacío = un solo formato, usa el precio y la unidad de arriba. ' +
        'Con formatos, el cliente elige y cada uno es una línea distinta del pedido.</div></div>' +
    '<div class="fgrid">' +
      '<div class="ff"><label>Módulo</label><select id="e-modulo">' +
        mods.map(m => '<option value="' + esc(m.id) + '"' +
          (m.id === v.modulo_id ? ' selected' : '') + '>' + esc(m.nombre) + '</option>').join('') +
        '<option value="__nuevo"' + (v.modulo_id ? '' : ' selected') + '>— módulo nuevo —</option>' +
      '</select></div>' +
      '<div class="ff"><label>Grupo</label>' +
        '<input id="e-grupo" value="' + esc(v.grupo) + '" list="lgrupos" placeholder="Tradicionales">' +
        '<datalist id="lgrupos">' + grupos.map(g => '<option value="' + esc(g) + '">').join('') +

      '<textarea id="e-desc" rows="2">' + esc(v.descripcion) + '</textarea></div>' +
    '<div class="ff"><label>Foto (URL)</label>' +
      '<input id="e-foto" value="' + esc(v.foto_url) + '" placeholder="https://..."></div>' +

      'aria-checked="' + (v.destacado ? 'true' : 'false') + '" data-check></button> Destacado (Más elegido)</div>' +
    '<div class="fcheck"><button class="sw" role="switch" id="e-activo" ' +
      'aria-checked="' + (v.activo ? 'true' : 'false') + '" data-check></button> Visible en la app</div>' +

      '<button class="guardar" data-guardar="' + (p ? esc(p.id) : '') + '">Guardar</button>' +

let editandoMod = '';

function datosForm(){
  const modSel = $('#e-modulo').value;
  const nuevo = modSel === '__nuevo';
  const nom = nuevo ? $('#e-modnom').value.trim() : '';
  if (nuevo && !nom) { alert('Poné el nombre del módulo nuevo.'); return null; }
  const prod = $('#e-producto').value.trim();
  if (!prod) { alert('Poné el nombre del producto.'); return null; }

  const ref = nuevo ? null : (CAT || []).filter(x => x.modulo_id === modSel)[0];
  return {
    producto: prod,
    precio: Number($('#e-precio').value) || 0,
    unidad: $('#e-unidad').value.trim(),
    formatos: $('#e-formatos').value.trim(),
    modulo_id: nuevo ? slugificar(nom) : modSel,
    modulo: nuevo ? nom : (ref ? ref.modulo : ''),
    modulo_desc: ref ? ref.modulo_desc : '',
    grupo: $('#e-grupo').value.trim() || 'Productos',
    conservacion: $('#e-cons').value,
    descripcion: $('#e-desc').value.trim(),
    foto_url: $('#e-foto').value.trim(),
    destacado: $('#e-destacado').getAttribute('aria-checked') === 'true',
    activo: $('#e-activo').getAttribute('aria-checked') === 'true',
  };
}

const slugificar = t => String(t).toLowerCase().normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '').slice(0, 8) || 'mod';

async function guardarProducto(id){
  const campos = datosForm();
  if (!campos) return;
  const r = await mandar({ action:'producto', id:id || '', sucursal:sucId(), campos:campos });
  if (r.error) return alert('No se pudo guardar: ' + r.error);
  editando = null; editandoMod = '';
  cargarCatalogo();
}

async function borrarProducto(id){
  const p = (CAT || []).filter(x => x.id === id)[0];
  if (!confirm('¿Sacar "' + (p ? p.producto : '') + '" del catálogo?\n\n' +
               'Los pedidos viejos no se tocan. Si solo te falta stock, usá el interruptor.')) return;
  const r = await mandar({ action:'borrarProducto', id:id });
  if (r.error) return alert('No se pudo borrar: ' + r.error);
  editando = null;
  cargarCatalogo();
}

async function togProducto(id){
  const p = (CAT || []).filter(x => x.id === id)[0];
  if (!p) return;
  p.activo = !p.activo;                       // se ve el cambio antes de la respuesta
  pintarCatalogo();
  const r = await mandar({ action:'producto', id:id, sucursal:sucId(),
                           campos:{ producto:p.producto, activo:p.activo } });
  if (r.error){ alert('No se pudo guardar: ' + r.error); cargarCatalogo(); }
}

async function guardarBarrio(slug){
  const campos = {
    nombre: $('#b-nombre').value.trim(),
    dia_entrega: $('#b-diaent').value, hora_entrega: $('#b-horaent').value.trim(),
    dia_cierre: $('#b-diacie').value, hora_cierre: Number($('#b-horacie').value) || 0,
    envio_costo: Number($('#b-envio').value) || 0,
    envio_min: Number($('#b-min').value) || 0,
    envio_gratis_desde: Number($('#b-gratis').value) || 0,
    desc_efectivo: (Number($('#b-desc').value) || 0) / 100,
    alias: $('#b-alias').value.trim(), titular: $('#b-titular').value.trim(),
    activo: $('#b-activo').getAttribute('aria-checked') === 'true',
  };
  if (!campos.nombre) return alert('Poné el nombre del barrio.');
  const r = await mandar({ action:'barrio', slug:slug, campos:campos });
  if (r.error) return alert('No se pudo guardar: ' + r.error);
  editando = null;
  cargarBarrios();

function copiar(txt, btn){
  const ok = () => { btn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2F8F5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 7"/></svg>'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(()=>{});
  else { const i = document.createElement('textarea'); i.value = txt; document.body.appendChild(i);
         i.select(); try { document.execCommand('copy'); ok(); } catch(e){} i.remove(); }
}

// Un solo oyente para todo lo editable: evita armar onclick con comillas adentro.
document.addEventListener('click', function(e){
  const b = e.target.closest('[data-edit],[data-tog],[data-nuevo],[data-cancel],[data-guardar],' +
                             '[data-borrar],[data-check],[data-editb],[data-guardarb],[data-link]');
  if (!b) return;
  if (b.hasAttribute('data-edit')){ editando = b.getAttribute('data-edit'); return pintarCatalogo(); }
  if (b.hasAttribute('data-tog'))  return togProducto(b.getAttribute('data-tog'));
  if (b.hasAttribute('data-nuevo')){
    editandoMod = b.getAttribute('data-nuevo'); editando = 'nuevo';
    pintarCatalogo();
    const el = $('#e-producto'); if (el) el.focus();
    return;
  }
  if (b.hasAttribute('data-cancel')){
    editando = null; editandoMod = '';
    return tab === 'barrios' ? pintarBarrios() : pintarCatalogo();
  }
  if (b.hasAttribute('data-guardar'))  return guardarProducto(b.getAttribute('data-guardar'));
  if (b.hasAttribute('data-borrar'))   return borrarProducto(b.getAttribute('data-borrar'));
  if (b.hasAttribute('data-editb')){ editando = b.getAttribute('data-editb'); return pintarBarrios(); }
  if (b.hasAttribute('data-guardarb')) return guardarBarrio(b.getAttribute('data-guardarb'));
  if (b.hasAttribute('data-link'))     return copiar(b.getAttribute('data-link'), b);
  if (b.hasAttribute('data-check')){
    b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
  }
});

/* ============ ACCIONES ============ */
async function mandar(cuerpo){
  const r = await fetch(BACKEND, {
    method:'POST', redirect:'follow',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ token: TOKEN }, cuerpo)),
  });
  return await r.json();
}

async function marcar(id, est){
  const p = PEDIDOS.filter(x => String(x.id).trim() === id)[0];
  if (!p) return;
  const nuevo = estado(p) === est ? 'pendiente' : est;
  p.estado = nuevo;                       // se pinta ya, sin esperar al servidor
  pintar();
  const r = await mandar({ action:'estado', id:id, estado:nuevo });
  if (r.error){ alert('No se pudo guardar: ' + r.error); cargar(true); }
}

async function cobrar(id, valor){
  const p = PEDIDOS.filter(x => String(x.id).trim() === id)[0];
  if (!p) return;
  p.cobrado = valor ? 'SI' : 'NO';
  pintar();
  const r = await mandar({ action:'cobro', id:id, cobrado: valor });
  if (r.error){ alert('No se pudo guardar: ' + r.error); cargar(true); }
}

function bajarCSV(){
  window.open(BACKEND + '?action=csv&token=' + encodeURIComponent(TOKEN) +
              '&suc=' + encodeURIComponent(suc), '_blank');
}

/* ============ INICIO ============ */
(async function(){
  await listarSucursales();
  const t = tok();
  if (!t || !SUCS.length) return;
  try {
    const r = await fetch(BACKEND + '?action=entrar&token=' + encodeURIComponent(t),
                          { redirect:'follow' });
    const d = await r.json();
    if (d.error) return;
    TOKEN = t; esAdmin = !!d.admin;
    let guardada = '';
    try { guardada = localStorage.getItem('ma_portal_suc') || ''; } catch(e){}
    suc = d.admin
      ? (SUCS.some(x => x.nombre === guardada) ? guardada : SUCS[0].nombre)
      : (SUCS.filter(x => x.id === d.suc)[0] || {}).nombre;
    if (suc) arrancarApp();
  } catch(e){}
})();

</script>
